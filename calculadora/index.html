<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <label for="ValA">Número 1</label>
    <input type="number" id="ValA" placeholder="Digite um número">
    <br>
    <label for="ValB">Número 2</label>
    <input type="number" id="ValB" placeholder="Digite outro número">
    <br>
    <button id="somar">Somar</button>
    <button id="subtracao">Subtrair</button>
    <button id="divisao">Dividir</button>
    <button id="multiplicacao">Multiplicar</button>
    <h2>Resultado:</h2>
    <p id="resposta"></p>
    <script src="script.js"></script>

</body>
</html>
